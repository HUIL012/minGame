<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css.css" />
</head>
<body id="body">
  <main id="playground" aria-label="萌萌追逐小游戏">
    <section id="hud" aria-label="游戏状态">
      <div class="stat">
        <span class="stat-label">甜点</span>
        <strong id="b">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">分数</span>
        <strong id="cs3">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">速度</span>
        <strong id="speedText">1x</strong>
      </div>
    </section>

    <div id="menu" aria-label="游戏操作">
      <button id="restart" type="button" title="重新开始">重新</button>
      <button id="startorstop" type="button" title="暂停或继续">暂停</button>
    </div>

    <p id="hint">方向键移动，也可以按住鼠标拖着跑</p>
    <p id="cs" aria-hidden="true"></p>

    <img src="images/a_07.png" id="boss" alt="玩家" draggable="false" />
    <img src="images/a_03.png" id="bossMax" alt="追逐者" draggable="false" />
    <img src="images/a_10.png" id="foods" alt="甜点" draggable="false" />

    <div id="foodfs" aria-hidden="true"></div>

    <div id="gameover" role="dialog" aria-modal="true" aria-labelledby="gameoverTitle">
      <div class="gameover-panel">
        <h1 id="gameoverTitle">被抓到啦</h1>
        <p id="die">挑战次数：0</p>
        <p id="food">吃到甜点：0</p>
        <p id="level">最终分数：0</p>
        <button id="again" type="button">再玩一次</button>
      </div>
    </div>
  </main>

  <script src="js.js"></script>
</body>
</html>
